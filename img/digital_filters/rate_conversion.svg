<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-label="Interpolation, decimation and rational sample rate conversion">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker></defs>
<rect width="760" height="350" fill="white"/>
<text x="20" y="35" fill="#111" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" text-anchor="start">Interpolation</text>
<path d="M25 65H170" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="170" y="43" width="95" height="44" fill="white" stroke="#111" stroke-width="2" rx="3"/>
<text x="217.5" y="71.0" fill="#111" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" text-anchor="middle">↑ L</text>
<path d="M265 65H365" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="365" y="43" width="155" height="44" fill="white" stroke="#111" stroke-width="2" rx="3"/>
<text x="442.5" y="71.0" fill="#111" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" text-anchor="middle">LPF (gain L)</text>
<path d="M520 65H735" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<text x="20" y="140" fill="#111" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" text-anchor="start">Decimation</text>
<path d="M25 170H170" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="170" y="148" width="155" height="44" fill="white" stroke="#111" stroke-width="2" rx="3"/>
<text x="247.5" y="176.0" fill="#111" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" text-anchor="middle">Anti-alias LPF</text>
<path d="M325 170H425" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="425" y="148" width="95" height="44" fill="white" stroke="#111" stroke-width="2" rx="3"/>
<text x="472.5" y="176.0" fill="#111" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" text-anchor="middle">↓ M</text>
<path d="M520 170H735" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<text x="20" y="245" fill="#111" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" text-anchor="start">Rational L/M</text>
<path d="M25 275H145" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="145" y="253" width="95" height="44" fill="white" stroke="#111" stroke-width="2" rx="3"/>
<text x="192.5" y="281.0" fill="#111" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" text-anchor="middle">↑ L</text>
<path d="M240 275H315" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="315" y="253" width="155" height="44" fill="white" stroke="#111" stroke-width="2" rx="3"/>
<text x="392.5" y="281.0" fill="#111" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" text-anchor="middle">LPF (gain L)</text>
<path d="M470 275H525" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="525" y="253" width="95" height="44" fill="white" stroke="#111" stroke-width="2" rx="3"/>
<text x="572.5" y="281.0" fill="#111" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" text-anchor="middle">↓ M</text>
<path d="M620 275H735" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<text x="380" y="338" fill="#111" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" text-anchor="middle">Example: 100 Msps → ↑3 → LPF → ↓2 → 150 Msps</text>
</svg>
